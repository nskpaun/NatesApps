# XcodeGen spec for the iPhone app: `brew install xcodegen && xcodegen` writes QuickTalk.xcodeproj.
name: QuickTalk
options:
  bundleIdPrefix: com.natesapps
  deploymentTarget:
    iOS: "17.2"   # the Meta Wearables Device Access Toolkit's minimum
packages:
  QuickTalkCore:
    path: QuickTalkCore
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.1.0
targets:
  QuickTalk:
    type: application
    platform: iOS
    sources: [QuickTalk]
    configFiles:
      Release: QuickTalkRelease.xcconfig
    dependencies:
      - package: QuickTalkCore
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATMockDevice
      - framework: Frameworks/QuickTalkLLMC.xcframework
        embed: false
      - framework: Frameworks/QuickTalkSpeechC.xcframework
        embed: false
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natesapps.quicktalk
        SWIFT_VERSION: "6.0"
        SWIFT_INCLUDE_PATHS: "$(BUILT_PRODUCTS_DIR)/include/QuickTalkSpeechC"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: QuickTalk/QuickTalk.entitlements
          META_APP_ID: "0"
          CLIENT_TOKEN: "0"
          MWDAT_CALLBACK_URL: "quicktalk://"
    info:
      path: QuickTalk/Info.plist
      properties:
        CFBundleDisplayName: QuickTalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: QuickTalk listens to the person you are talking with, on this phone only, to suggest replies.
        NSBluetoothAlwaysUsageDescription: QuickTalk connects to your Meta glasses to show replies on them.
        UIBackgroundModes: [processing, bluetooth-central, bluetooth-peripheral]
        LSApplicationQueriesSchemes: [fb-viewapp]
        NSLocalNetworkUsageDescription: QuickTalk uses the local network to connect to your glasses.
        NSBonjourServices: ["_bonjour._tcp"]
        # Developer Mode registration returns through this custom scheme.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [quicktalk]
        MWDAT:
          AppLinkURLScheme: $(MWDAT_CALLBACK_URL)
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics:
            OptOut: true
  QuickTalkDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuickTalkDeviceTests]
    dependencies:
      - target: QuickTalk
      - package: QuickTalkCore
      - package: MWDAT
        product: MWDATCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: "$(BUILT_PRODUCTS_DIR)/include/QuickTalkSpeechC"
        PRODUCT_BUNDLE_IDENTIFIER: com.natesapps.quicktalk.tests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  QuickTalk:
    build:
      targets:
        QuickTalk: all
    test:
      targets:
        - QuickTalkDeviceTests
