<title>LEGO Battlestation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: big 3D build view, build-step rail on the right. Same bench look as the pocket-section explorer. */
:root {
  --bg: #EEEDE8; --panel: #F8F7F3; --ink: #1F2124; --muted: #6B6D70; --line: #D5D3CC; --accent: #C46A1B; --sel: #1F6FD1;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16171A; --panel: #1E2024; --ink: #ECEAE4; --muted: #9A9893; --line: #34363B; --accent: #E89344; --sel: #5AA2F2; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #16171A; --panel: #1E2024; --ink: #ECEAE4; --muted: #9A9893; --line: #34363B; --accent: #E89344; --sel: #5AA2F2; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: 1fr 340px; }
.view { position: relative; min-width: 0; }
#c { position: absolute; inset: 0; }
.top { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; pointer-events: none; }
.top > * { pointer-events: auto; }
h1 { margin: 0; font-size: 17px; font-weight: 500; }
h1 span { color: var(--muted); font-weight: 400; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.ctl input[type=range] { width: 140px; accent-color: var(--accent); }
.ctl b { font-family: var(--mono); font-weight: 400; color: var(--ink); min-width: 5ch; }
button.t { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
button.t[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.hint { position: absolute; bottom: 12px; left: max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; color: var(--muted); pointer-events: none; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 16px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.card h2 { margin: 0 0 6px; font-size: 15px; font-weight: 500; }
.card p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.sec { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -6px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
td { padding: 5px 2px; border-top: 1px solid var(--line); vertical-align: top; }
td.q { font-family: var(--mono); text-align: right; white-space: nowrap; color: var(--muted); }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; border: 1px solid var(--line); }
.stats { font-size: 13px; line-height: 1.6; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 500; }
@media (max-width: 760px) { body { overflow: auto; } .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>

<div class="app">
  <div class="view">
    <div id="c"></div>
    <div class="top">
      <h1>LEGO battlestation <span>· full station</span></h1>
      <label class="ctl" for="step">Build step <input id="step" type="range" min="1" max="10" value="10"><b id="stepv">10/10</b></label>
      <label class="ctl" for="ex">Spread layers <input id="ex" type="range" min="0" max="100" value="0"></label>
      <button class="t" id="dev" aria-pressed="true">Monitors &amp; devices</button>
      <button class="t" id="reset">Reset view</button>
    </div>
    <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>
  <aside>
    <div class="card"><h2 id="stepTitle">Step</h2><p id="stepText"></p></div>
    <div class="stats" id="stats"></div>
    <div class="sec">Parts added in this step</div>
    <table id="stepParts"></table>
    <div class="sec">Whole parts list</div>
    <table id="allParts"></table>
  </aside>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const BRICKS = 'station-bricks-v1.json', PARTS = 'station-parts-v1.json';
const [data, parts] = await Promise.all([fetch(BRICKS, { cache: 'no-store' }).then(r => r.json()), fetch(PARTS, { cache: 'no-store' }).then(r => r.json())]);

const host = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 1.5));
const d1 = new THREE.DirectionalLight(0xffffff, 1.8); d1.position.set(-300, -500, 700); scene.add(d1);
const cam = new THREE.PerspectiveCamera(30, 1, 1, 20000); cam.up.set(0, 0, 1);
const controls = new OrbitControls(cam, renderer.domElement); controls.enableDamping = true;
// data frame: x right, y toward the user (0 = back), z up. Flip y so +y in three is away from the viewer.
const P = (x, y, z) => new THREE.Vector3(x, -y, z);

const studGeo = new THREE.CylinderGeometry(2.4, 2.4, 1.7, 8); studGeo.rotateX(Math.PI / 2);
const steps = Math.max(...data.bricks.map(b => b.step));
const layers = [];
for (let s = 1; s <= steps; s++) layers.push({ grp: new THREE.Group(), z0: Infinity });
const mats = {};
const mat = hex => mats[hex] || (mats[hex] = new THREE.MeshStandardMaterial({ color: hex, roughness: .45 }));
const studsPer = {};
// Slope parts: a wedge that falls toward b.slope.down (x+, x-, y+ or y-), keeping a lip of b.slope.lip_mm at full height.
function wedge(b) {
  const sx = b.sx - 0.2, sy = b.sy - 0.2, h = b.sz, d = String(b.slope.down || 'y+'), lip = b.slope.lip_mm || 0, low = Math.min(h, 4.8);
  const along = /x/.test(d) ? sx : sy, sign = d.includes('-') ? -1 : 1;
  const shape = new THREE.Shape(); const L = along / 2;
  const top = (t) => t; // profile in (u along slope, z)
  const p = [[-L, -h / 2], [L, -h / 2]];
  if (sign > 0) { p.push([L, -h / 2 + low], [-L + Math.min(lip, along), h / 2], [-L, h / 2]); }
  else { p.push([L, h / 2], [L - Math.min(lip, along), h / 2], [-L, -h / 2 + low]); }
  shape.moveTo(...p[0]); p.slice(1).forEach(q => shape.lineTo(...q)); shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: /x/.test(d) ? sy : sx, bevelEnabled: false });
  g.translate(0, 0, -(/x/.test(d) ? sy : sx) / 2);
  if (/x/.test(d)) g.rotateX(Math.PI / 2); else { g.rotateX(Math.PI / 2); g.rotateZ(Math.PI / 2); }
  if (/y/.test(d)) g.scale(1, -1, 1);
  return g;
}
// Merge every step's bricks into one mesh per colour and one line set, so thousands of bricks stay fast.
const bucket = {}, edgeBucket = {};
for (const b of data.bricks) {
  const L = layers[b.step - 1]; L.z0 = Math.min(L.z0, b.z);
  const g = b.slope ? wedge(b) : new THREE.BoxGeometry(b.sx - 0.2, b.sy - 0.2, b.sz);
  const c = P(b.x + b.sx / 2, b.y + b.sy / 2, b.z + b.sz / 2);
  const e = new THREE.EdgesGeometry(g); e.translate(c.x, c.y, c.z);
  const gi = g.index ? g.toNonIndexed() : g; gi.translate(c.x, c.y, c.z);
  for (const n of Object.keys(gi.attributes)) if (n !== 'position' && n !== 'normal') gi.deleteAttribute(n);
  (bucket[b.step + '|' + b.color_hex] ||= []).push(gi);
  (edgeBucket[b.step] ||= []).push(e);
  if (b.kind !== 'tile' && !b.slope) (studsPer[b.step + '|' + b.color_hex] ||= []).push(b);
}
for (const [k, list] of Object.entries(bucket)) { const [step, hex] = k.split('|'); layers[step - 1].grp.add(new THREE.Mesh(mergeGeometries(list), mat(hex))); }
const lineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .18 });
for (const [step, list] of Object.entries(edgeBucket)) layers[step - 1].grp.add(new THREE.LineSegments(mergeGeometries(list), lineMat));
for (const [k, list] of Object.entries(studsPer)) {
  const [step, hex] = k.split('|'); let n = 0; for (const b of list) n += Math.round(b.sx / 8) * Math.round(b.sy / 8);
  const inst = new THREE.InstancedMesh(studGeo, mat(hex), n); const M = new THREE.Matrix4(); let i = 0;
  for (const b of list) for (let a = 0; a < Math.round(b.sx / 8); a++) for (let c = 0; c < Math.round(b.sy / 8); c++)
    inst.setMatrixAt(i++, M.makeTranslation(...P(b.x + 4 + a * 8, b.y + 4 + c * 8, b.z + b.sz + .85).toArray()));
  layers[step - 1].grp.add(inst);
}
layers.forEach(L => scene.add(L.grp));
const refGrp = new THREE.Group(); scene.add(refGrp);
for (const r of data.reference) {
  const g = new THREE.BoxGeometry(r.sx, r.sy, r.sz);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: r.color_hex, transparent: true, opacity: /monitor|screen/i.test(r.name) ? 1 : (r.kind === 'device' ? .6 : .9) }));
  m.position.copy(P(r.x + r.sx / 2, r.y + r.sy / 2, r.z + r.sz / 2)); m.userData.r = r; refGrp.add(m);
}

const [W, D, H] = data.size_mm;
const center = P(W / 2, D / 2, H / 2);
function home() { cam.position.set(center.x - 700, center.y - 2700, center.z + 1000); controls.target.copy(center); controls.update(); }

const stepEl = document.getElementById('step'), exEl = document.getElementById('ex');
stepEl.max = steps; stepEl.value = steps;
let showDev = true;
const row = (p, q) => `<tr><td><span class="sw" style="background:${p.hex}"></span>${p.name}<br><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${p.part} · ${p.colour}</span></td><td class="q">×${q}</td></tr>`;
const hexOf = {}; for (const b of data.bricks) hexOf[b.color] = b.color_hex;
function apply() {
  const s = +stepEl.value, k = exEl.value / 100 * 12;
  document.getElementById('stepv').textContent = `${s}/${steps}`;
  layers.forEach((L, i) => { L.grp.visible = i < s; L.grp.position.z = i * k; });
  refGrp.visible = showDev;
  refGrp.children.forEach(m => { m.visible = showDev; m.position.z = m.userData.r.z + m.userData.r.sz / 2 + (m.userData.r.kind === 'device' ? 8 * k : 3 * k); });
  document.getElementById('stepTitle').textContent = `Step ${s} of ${steps}`;
  document.getElementById('stepText').textContent = data.steps[String(s)] || '';
  const counts = {};
  for (const b of data.bricks.filter(b => b.step === s)) { const key = b.part + '|' + b.color; counts[key] = (counts[key] || 0) + 1; }
  document.getElementById('stepParts').innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([key, q]) => {
    const [part, colour] = key.split('|'); const b = data.bricks.find(x => x.part === part && x.color === colour);
    return row({ name: b.name, part, colour, hex: b.color_hex }, q);
  }).join('');
}
stepEl.addEventListener('input', apply); exEl.addEventListener('input', apply);
document.getElementById('dev').addEventListener('click', e => { showDev = !showDev; e.currentTarget.setAttribute('aria-pressed', String(showDev)); apply(); });
document.getElementById('reset').addEventListener('click', home);
const total = parts.reduce((a, p) => a + +p.qty, 0), cost = parts.reduce((a, p) => a + +p.est_total_usd, 0);
document.getElementById('stats').innerHTML = `<b>${data.size_studs[0]} × ${data.size_studs[1]} studs</b> (${W} × ${D} × ${H.toFixed(1)} mm), <b>${total} parts</b>, about <b>$${Math.round(cost)}</b> on BrickLink before shipping. Plus two metal VESA pole stands that carry the monitors, two aluminium bars, and your electronics.`;
document.getElementById('allParts').innerHTML = parts.sort((a, b) => b.qty - a.qty).map(p => row({ name: p.name, part: p.bricklink_id, colour: p.colour, hex: hexOf[p.colour] || '#999' }, p.qty)).join('');
function size() { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
new ResizeObserver(size).observe(host); size(); home(); apply();
let dirty = true; const draw = () => { dirty = true; };
controls.addEventListener('change', draw); stepEl.addEventListener('input', draw); exEl.addEventListener('input', draw);
document.getElementById('dev').addEventListener('click', draw); new ResizeObserver(draw).observe(host);
(function loop() { if (controls.update() || dirty) { dirty = false; renderer.render(scene, cam); } requestAnimationFrame(loop); })();
</script>
