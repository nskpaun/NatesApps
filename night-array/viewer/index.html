<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:">
<title>Night Array · live view</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; overscroll-behavior: none; }
  html.standalone-page { background: #0C0A09; }
  body {
    font-family: Inter, Roboto, "Helvetica Neue", Arial, sans-serif; color: #F2EAE1;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #stage canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none;
    touch-action: none; opacity: 0; transition: opacity .65s ease;
  }
  #stage.ready canvas { opacity: 1; }
  #stage.instant canvas { transition: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .35s ease; }
  #labels.on { opacity: 1; }
  .dim {
    position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform;
    font: 500 10.5px/1 Inter, Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: .07em;
    padding: 4px 7px 4px; border-radius: 10px;
    background: rgba(12, 10, 9, .82); color: #F2EAE1; border: 1px solid rgba(242, 160, 74, .45);
    box-shadow: 0 1px 6px rgba(0, 0, 0, .35); font-variant-numeric: tabular-nums;
  }
  .dim.hide { display: none; }
  #labels[data-style="cad"] .dim { background: rgba(250, 250, 249, .94); color: #1C1F23; border-color: rgba(28, 31, 35, .35); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
  #labels[data-style="blueprint"] .dim { background: rgba(8, 22, 40, .9); color: #F2C58A; border-color: rgba(242, 160, 74, .55); box-shadow: none; }
  #labels[data-style="xray"] .dim { background: rgba(14, 12, 11, .8); color: #F2EAE1; border-color: rgba(242, 234, 225, .35); }
  #msg {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(78vw, 360px);
    padding: 16px 18px; border-radius: 14px; text-align: center; line-height: 1.45; font-size: 13px;
    background: rgba(21, 17, 15, .9); border: 1px solid #2E2621; color: #F2EAE1; box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
    transition: opacity .6s ease;
  }
  #msg[hidden] { display: none; }
  #msg.fade { opacity: 0; }
  #msg b { display: block; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; color: #F2A04A; margin-bottom: 6px; }
  #msg span { color: #A39A90; }
</style>
</head>
<body>
<div id="stage"><div id="labels"></div></div>
<div id="msg" role="status" hidden></div>
<script src="viewer.js"></script>
</body>
</html>
